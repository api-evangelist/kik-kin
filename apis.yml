name: Kik (Kin)
description: >-
  Kik (Kin) refers to the Kin cryptocurrency created by Kik Interactive, the
  messaging company, as a blockchain-based digital currency for use inside
  consumer applications. Kin originally launched on a fork of the Stellar
  network and later migrated to Solana, shipping first-party developer SDKs
  (JavaScript/Node and Python) under the kinecosystem GitHub organization and a
  developer program at developer.kin.org. The Kin project is now defunct: the
  developer surface no longer resolves, every kinecosystem repository is
  archived, the published SDKs are deprecated, and Kik itself was acquired by
  MediaLab AI Inc. This profile was surfaced as a portfolio company of Pantera
  Capital and is retained as a historical record of a wound-down crypto
  developer surface.
